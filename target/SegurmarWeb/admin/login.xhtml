<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:pt="jakarta.faces.passthrough" template="/WEB-INF/templates/plantilla.xhtml">
    <ui:define name="titulo">Acceso del personal | SEGURMAR</ui:define>
    <ui:define name="contenido">
        <section class="container" style="max-width:950px"><div class="row justify-content-center align-items-center g-4 py-lg-4">
            <div class="col-md-8 col-lg-7"><div class="surface-card p-4 p-lg-5">
                <div class="mb-4"><span class="section-kicker dark">ACCESO RESTRINGIDO</span><h1 class="h2 fw-bold mt-2">Iniciar sesión</h1><p class="text-muted">Ingresa con tu cuenta autorizada para gestionar las solicitudes de SEGURMAR.</p></div>
                <h:form id="formLogin">
                    <h:messages globalOnly="true" layout="list" styleClass="alert alert-danger list-unstyled mb-3" />
                    <div class="mb-3"><h:outputLabel for="correo" value="Correo de acceso" styleClass="form-label fw-semibold" />
                        <h:inputText id="correo" value="#{loginBean.correo}" required="true" requiredMessage="Ingresa tu correo electrónico." styleClass="form-control form-control-lg" maxlength="254" pt:type="email" pt:autocomplete="username" pt:placeholder="tu.correo@empresa.com" />
                        <h:message for="correo" styleClass="text-danger small" /></div>
                    <div class="mb-4"><h:outputLabel for="clave" value="Contraseña" styleClass="form-label fw-semibold" />
                        <h:inputSecret id="clave" value="#{loginBean.clave}" required="true" requiredMessage="Ingresa tu contraseña." styleClass="form-control form-control-lg" redisplay="false" pt:autocomplete="current-password" />
                        <h:message for="clave" styleClass="text-danger small" /></div>
                    <h:commandButton value="Ingresar al panel" action="#{loginBean.ingresar}" styleClass="btn btn-primary btn-lg w-100" />
                </h:form>
                <div class="mt-4 text-center"><a href="#{request.contextPath}/index.jsp" class="text-decoration-none">← Volver al portal</a></div>
            </div></div>
            <div class="col-lg-5 d-none d-lg-block"><img src="#{request.contextPath}/assets/images/comercial-monitoreo.jpg" class="img-fluid rounded-4 shadow-sm" alt="Centro de monitoreo SEGURMAR" /><p class="small text-muted mt-3">Uso exclusivo del personal autorizado.</p></div>
        </div></section>
    </ui:define>
</ui:composition>
