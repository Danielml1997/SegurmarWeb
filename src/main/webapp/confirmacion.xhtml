<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                template="/WEB-INF/templates/plantilla.xhtml">
    <ui:define name="titulo">Solicitud registrada | SEGURMAR</ui:define>
    <ui:define name="contenido">
        <div class="success-card text-center mx-auto my-4 px-4 px-lg-5 py-5">
            <div class="success-icon">✓</div>
            <h1 class="h2 fw-bold mt-3">Solicitud registrada correctamente</h1>
            <p class="text-muted mt-3">Gracias, <strong><h:outputText value="#{flash.nombreCliente}" /></strong>.</p>
            <p>Hemos recibido tu solicitud de cotización para:</p>
            <h2 class="h4 text-primary mb-3"><h:outputText value="#{flash.servicioSolicitado}" /></h2>
            <p class="text-muted">Nuestro equipo de SEGURMAR revisará la información proporcionada.</p>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-4"><a href="#{request.contextPath}/index.jsp" class="btn btn-primary px-4">Volver al inicio</a><h:link outcome="/cotizacion" value="Solicitar otra cotización" styleClass="btn btn-outline-primary px-4" /></div>
        </div>
    </ui:define>
</ui:composition>
